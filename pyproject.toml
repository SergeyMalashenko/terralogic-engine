[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "terralogic-engine"
version = "0.6.0"
description = "Land-parcel acquisition, spatial analytics, reporting, and case visualization"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.10",
    "pyproj>=3.7",
    "shapely>=2.0.6",
]

[project.optional-dependencies]
mcp = ["mcp>=1.27,<2"]
viewer = [
    "branca>=0.7",
    "folium>=0.19",
    "streamlit>=1.40",
    "streamlit-folium>=0.24",
]

[project.scripts]
terralogic-collect = "terralogic_engine.cli:main"
terralogic-analyze = "terralogic_engine.analytics.cli:main"
terralogic-mcp = "terralogic_engine.mcp:main"
terralogic-view = "terralogic_engine.viewer.cli:main"

[dependency-groups]
test = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
]
lint = [
    "mypy>=1.14",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/terralogic_engine"]

[tool.hatch.build.targets.wheel.force-include]
"src/terralogic_engine/store/migrations" = "terralogic_engine/store/migrations"
"src/terralogic_engine/reporting/templates" = "terralogic_engine/reporting/templates"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
