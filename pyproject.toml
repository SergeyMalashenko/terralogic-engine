[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "terralogic-acquisition"
version = "0.3.3"
description = "Deterministic acquisition and local case storage for land-parcel analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.10",
    "pyproj>=3.7",
    "shapely>=2.0.6",
]

[project.optional-dependencies]
mcp = ["mcp>=1.27,<2"]
viewer = [
    "branca>=0.7",
    "folium>=0.19",
    "streamlit>=1.40",
    "streamlit-folium>=0.24",
]

[project.scripts]
terralogic-collect = "terralogic_acquisition.cli:main"
terralogic-view = "terralogic_acquisition.viewer.cli:main"

[dependency-groups]
test = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
]
lint = [
    "mypy>=1.14",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/terralogic_acquisition"]

[tool.hatch.build.targets.wheel.force-include]
"src/terralogic_acquisition/store/migrations" = "terralogic_acquisition/store/migrations"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
