# Словарь «тип зоны → текст для клиента» для QuickReport.
# match: как опознать зону в данных НСПД/аналитики (подстроки, casefold,
# матч по zone_type ИЛИ name пересечения). guidance — «что это значит для
# вас» в таблице факторов; action — что проверяем в подробном заключении.
# Ключи синхронизированы с scoring_rules.yaml (поле guidance каждого правила).

zones:
  water_protection:
    match: ["водоохранн", "водоохранная зона"]
    title: "Водоохранная зона"
    guidance: >
      На этой части участка действуют ограничения, связанные с охраной водного
      объекта: требования к расположению построек, ведению хозяйственной
      деятельности и обращению с отходами. Нужно выяснить, как организовать
      канализацию и отвод воды с участка с учётом требований по охране водоёма.
    action: "Проверить границы водоохранной зоны по акту водного объекта и требования к отведению сточных вод."

  coastal_strip:
    match: ["прибрежн", "защитная полоса"]
    title: "Прибрежная защитная полоса"
    guidance: >
      В пределах полосы ограничены строительство и ряд работ. Нужно проверить,
      где можно разместить дом и другие постройки и какие работы допустимы
      на этой части участка.
    action: "Установить точную ширину полосы и допустимые виды использования."

  airport_subzone:
    match: ["приаэродромн", "аэропорт", "шереметьево", "внуково", "домодедово", "жуковский"]
    title: "Подзона приаэродромной территории"
    guidance: >
      Близость аэропорта влечёт ограничения по высоте застройки и требования
      к техническим средствам. Нужно уточнить, какие требования действуют
      для вашей подзоны и затрагивают ли они ваши планы на участок.
    action: "Проверить высотные ограничения и требования к аэрооборудованию для подзоны."

  oopt:
    match: ["особо охраняем", "заказник", "национальн", "природн", "парк"]
    title: "Особо охраняемая природная территория"
    guidance: >
      На ООПТ действует особый режим природопользования: возможны серьёзные
      ограничения на строительство и коммуникации. Требуется детальная
      юридическая проверка возможности размещения дома.
    action: "Установить категорию ООПТ и режимные требования (паспорт ООПТ)."

  cultural_heritage:
    match: ["культурного наследия", "зокн", "памятник"]
    title: "Зона охраны объекта культурного наследия"
    guidance: >
      В зоне охраны ОКН любые работы и застройка требуют согласований.
      Проект дома может быть затруднён или невозможен без историко-культурной
      экспертизы.
    action: "Проверить предмет охраны и границы зоны в реестре ОКН."

  power_line:
    match: ["линии электропередачи", "леп", "охранная зона лэп"]
    title: "Охранная зона линии электропередачи"
    guidance: >
      В охранной зоне ЛЭП ограничены высота насаждений и строительство;
      возможны требования к согласованию. Нужно уточнить категорию линии
      и допустимые работы.
    action: "Определить категорию ЛЭП и согласуемые работы в охранной зоне."

  pipeline:
    match: ["магистральн", "трубопровод", "газопровод", "нефтепровод"]
    title: "Охранная зона магистрального трубопровода"
    guidance: >
      Охранная зона магистрального трубопровода — один из самых жёстких
      факторов: строительство жилого дома может быть запрещено или сильно
      ограничено. Требуется проверка по правилам охраны соответствующей сети.
    action: "Установить тип и диаметр трубопровода, проверить допустимость жилой застройки."

  sanitary_zone:
    match: ["санитарно-защитн", "сзз"]
    title: "Санитарно-защитная зона"
    guidance: >
      СЗЗ существующего или планируемого объекта ограничивает размещение
      жилых построек. Нужно выяснить, для какого объекта установлена зона
      и действует ли она.
    action: "Идентифицировать источник СЗЗ и статус зоны (действующая/проектная)."

  forest_protection:
    match: ["защитные леса", "лесные участки", "лесополос"]
    title: "Защитный лес / лесные участки"
    guidance: >
      Расположение в границах лесных участков влечёт ограничения на
      вырубку и изменение рельефа. Обычно совместимо с ИЖС, но требует
      аккуратности при планировании участка.
    action: "Проверить статус лесного участка и порядок пользования."

  zsoutu:
    match: ["особым условиям использования", "зсоут", "зсоту"]
    title: "Зона с особыми условиями использования территории"
    guidance: >
      ЗСОТУ устанавливает специальные требования к застройке и использованию.
      Нужно изучить решение о зонировании для понимания допустимых параметров.
    action: "Запросить/найти решение об установлении ЗСОТУ."

# Не-зональные информационные блоки
misc:
  communications:
    title: "Коммуникации не проверены"
    guidance: >
      В имеющихся данных нет информации о подключении участка к электричеству,
      воде и канализации, а также о возможности подъезда. Это нужно уточнить,
      чтобы понять, какие работы потребуются и сколько они могут стоить.
