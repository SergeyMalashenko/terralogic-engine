# Утверждённые шаблоны раздела «Что уже удалось установить» (стандарт
# отчёта v22). Выбор варианта — детерминированный, по status_key вердикта
# методики 6.2 (scoring_rules.yaml); LLM лишь адаптирует текст, не меняя
# вариант. Fallback writer'а — шаблон verbatim. Отдельный актив: тексты
# не участвуют в скоринге, поэтому файл НЕ входит в methodology_sha256.
version: 1
variants:
  a:
    status: ok
    text: >-
      Назначение участка допускает индивидуальный дом. Экспресс-оценка уже
      определила основные зоны и факторы, которые могут повлиять на
      размещение дома, инженерные решения и расходы. Теперь их можно
      проверять предметно — с учётом вашего проекта.
  b:
    status: stop
    text: >-
      Назначение участка содержит существенные ограничения, блокирующие или
      критически осложняющие строительство дома. Экспресс-оценка выявила
      защитные режимы территории, которые несут риск отказа в согласовании
      или судебного предписания. Рассмотрение участка под жильё невозможно
      до устранения правовых блокировок.
  c:
    status: attention
    text: >-
      Назначение участка допускает строительство дома, но территория
      содержит существенные градостроительные ограничения. Экспресс-оценка
      зафиксировала зоны с особыми условиями, сокращающие пятно застройки и
      требующие специальных согласований. Дальнейшая проверка покажет,
      удастся ли безопасно разместить дом в свободной части участка.
  d:
    status: insufficient
    text: >-
      По участку не получено достаточно сведений, чтобы подтвердить
      возможность размещения дома. Экспресс-оценка зафиксировала пробелы в
      ключевых источниках, и числовая оценка приостановлена до их
      уточнения. Следующий шаг — добрать недостающие документы и проверить
      участок предметно.
