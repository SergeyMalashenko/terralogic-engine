# Каталог классов ЗОУИТ по ст. 105 ЗК РФ — методика 6.3 (2026-10-29, вериф.).
# Цель: индивидуальный жилой дом.
#
# Отличие от 6.2: специальный маршрут мелиорации §6.1 — общий слой
# «Мелиорируемые земли» больше не отбрасывается (not_zouit), а получает
# маршрут melioration: INFO_MELIORATION / Q30 по данным reclamation РГИС;
# подтверждённое влияние — в группе melioration_influence (потолок 40).
#
# item — номер пункта ст. 105 ЗК РФ (ключ классификации, не номер группы
# расчёта). Пункты 21, 22, 27 в проверенной редакции (13.10.2026) утратили
# силу: записи помечены obsolete и распознаются, но требуют проверки
# актуальности основания. Пункты 26 и 28 в проверенной выдержке не читаются
# — оставлены без match-правил до уточнения редакции.
#
# match — подстроки (casefold) по «zone_type + name»; первое совпадение
# выигрывает (порядок записей важен: частное раньше общего).
# handling:
#   special:<factor_id> — сохранённое спецправило 6.1 (scoring_rules.yaml);
#   airport             — приаэродромная логика (подзоны/сектора/Q30) в коде;
#   universal           — универсальная шкала E0–E4 при подтверждённом
#                         режиме, иначе Q30 (режим неизвестен);
#   not_zouit           — не является ЗОУИТ по ст. 105 ЗК РФ: исключается из
#                         скоринга и таблицы факторов с протокольной пометкой.
#   melioration         — специальный маршрут §6.1 (6.3): общий слой без
#                         данных reclamation → информационная запись
#                         INFO_MELIORATION (вне суммы вычетов); система
#                         подтверждена, режим неизвестен → Q30; перечень
#                         особо ценных угодий — отдельная проверка.
# regime_effects — курируемая таблица подтверждённых режимов:
# registry_number или match-фрагмент имени → effect_code и основание.
# Пустая на старте: нераскрытый режим подтверждённой зоны → Q30.

catalog:
  - item: 1
    class: "Зоны охраны объектов культурного наследия"
    group: cultural_heritage
    match:
      - "зона регулирования застройки"
      - "охранная зона объекта культурного наследия"
      - "зоны охраны объектов культурного наследия"
      - "зоны и территории объектов культурного наследия"
      - "зоны и территории окн"
      - "территории окн"
      - "зона охраняемого ландшафта"
      - "культурного наследия"
    handling: universal
  - item: 2
    class: "Защитная зона объекта культурного наследия"
    group: cultural_heritage
    match: ["защитная зона объекта культурного наследия", "защитная зона окн"]
    handling: universal
  - item: 3
    class: "Электроэнергетические объекты"
    group: power_line
    match: ["охранная зона лэп", "линии электропередачи", "леп", "электропередач", "электросетев", "электроэнергетич"]
    handling: special:lep_zone
  - item: 4
    class: "Железнодорожные охранные зоны"
    group: transport
    match: ["железнодорожн", "железной дороги", "железнодорожного пути"]
    handling: universal
  - item: 5
    class: "Придорожные полосы автомобильных дорог"
    group: transport
    match: ["придорожн", "автомобильных дорог", "автодорог"]
    handling: universal
  - item: 6
    class: "Охранные зоны трубопроводов"
    group: pipelines
    match: ["трубопровод", "газопровод", "нефтепровод", "продуктопровод", "магистральн"]
    handling: universal
  - item: 7
    class: "Линии и сооружения связи"
    group: communications
    match: ["линии и сооружения связи", "линейно-кабельн", "сооружения связи", "охранная зона линии связи"]
    handling: universal
  - item: 8
    class: "Приаэродромная территория"
    group: airport
    match: ["приаэродромн"]
    handling: airport
  - item: 9
    class: "Зоны охраняемых объектов"
    group: special_regimes
    match: ["охраняемых объектов", "охраняемого объекта"]
    handling: universal
  - item: 10
    class: "Военные охранные, запретные и специальные зоны"
    group: special_regimes
    match: ["военн", "запретная зона", "специальная зона"]
    handling: universal
  - item: 11
    class: "Охранные зоны ООПТ"
    group: nature_protection
    match: ["особо охраняем", "оопт", "заказник", "национальн", "природный парк", "природного парка"]
    handling: universal
  - item: 12
    class: "Пункты наблюдения за состоянием окружающей среды"
    group: observation
    match: ["пункт наблюдени", "наблюдения за состоянием окружающей"]
    handling: universal
  - item: 13
    class: "Водоохранные зоны"
    group: water
    match: ["водоохранн"]
    handling: special:water_protection_zone
  - item: 14
    class: "Прибрежные защитные полосы"
    group: water
    match: ["прибрежн"]
    handling: special:coastal_strip
  - item: 16
    class: "ЗСО водоснабжения и зоны специальной охраны подземных вод"
    group: sanitary
    match: ["зона санитарной охраны", "зоны санитарной охраны", "зсо", "специальной охраны подземных вод"]
    handling: special:sanitary_protection
  - item: 15
    class: "Округа санитарной и горно-санитарной охраны лечебных ресурсов"
    group: sanitary
    match: ["горно-санитарн", "округ санитарной охраны", "санитарной охраны"]
    handling: universal
  - item: 17
    class: "Затопление и подтопление"
    group: natural_hazards
    match: ["затоплени", "подтоплени"]
    handling: universal
  - item: 18
    class: "Санитарно-защитные зоны"
    group: sanitary
    match: ["санитарно-защитн"]
    handling: special:sanitary_guard
  - item: 19
    class: "Ограничения передающих радиотехнических объектов"
    group: radiotech
    match: ["радиотехнич", "радиопередающ", "передающих радиотехнических"]
    handling: universal
  - item: 20
    class: "Геодезические, нивелирные, гравиметрические пункты"
    group: observation
    match: ["геодезическ", "нивелирн", "гравиметрическ"]
    handling: universal
  - item: 21
    class: "Рыбохозяйственная заповедная зона озера Байкал"
    group: fisheries
    obsolete: true
    match: ["байкал"]
    handling: universal
  - item: 22
    class: "Рыбохозяйственные заповедные зоны"
    group: fisheries
    obsolete: true
    match: ["рыбохозяйственн"]
    handling: universal
  - item: 23
    class: "Минимальные расстояния до трубопроводов"
    group: pipelines
    match: ["минимальные расстояния", "минимального расстояния"]
    handling: universal
  - item: 24
    class: "Гидроэнергетические объекты"
    group: hydroenergy
    match: ["гидроэнергетич", "гидроэлектростанц", "гэс"]
    handling: universal
  - item: 25
    class: "Тепловые сети"
    group: heat
    match: ["тепловых сетей", "тепловой сети", "теплоснабжени"]
    handling: universal

# Названия групп расчёта (для протокола и причин вердикта).
groups:
  cultural_heritage: "Культурное наследие"
  transport: "Транспортные ограничения"
  pipelines: "Охранные зоны трубопроводов"
  communications: "Линии и сооружения связи"
  airport: "Приаэродромная территория"
  special_regimes: "Специальные режимы"
  nature_protection: "Природоохранные ограничения"
  observation: "Пункты наблюдения и измерений"
  water: "Водные ограничения водного объекта"
  sanitary: "Санитарные зоны"
  natural_hazards: "Природные опасности"
  radiotech: "Радиотехнические ограничения"
  fisheries: "Рыбохозяйственные ограничения"
  hydroenergy: "Гидроэнергетическая инфраструктура"
  heat: "Теплоснабжение"
  power_line: "Охранные зоны инфраструктуры"
  forest: "Лесные ограничения"
  utility_infra: "Инженерные коммуникации"
  planning: "Планировочные ограничения"
  not_zouit: "Вне перечня ЗОУИТ ст. 105 ЗК РФ"
  melioration_influence: "Мелиоративное влияние"

# Факторы вне каталога ЗОУИТ (§6 методики 6.2).
extra:
  - key: forest_lands
    class: "Лесные земли, защитные леса, особо защитные участки лесов"
    group: forest
    match: ["особо защитн", "защитные леса", "защитный лес", "лесных участков", "лесничеств"]
    handling: special:forest_protection
  - key: utility_infra
    class: "Охранные зоны инженерных коммуникаций (тип не расшифрован)"
    group: utility_infra
    match: ["инженерных коммуникаций", "инженерной инфраструктуры"]
    handling: universal
  - key: shore_strip
    class: "Береговая полоса общего пользования"
    group: water
    match: ["береговая полоса"]
    handling: universal
  - key: red_lines
    class: "Красные линии и территории общего пользования"
    group: planning
    match: ["красные линии", "красной линии"]
    handling: universal
  - key: melioration_lands
    class: "Мелиорируемые земли"
    group: melioration_influence
    match: ["мелиорируем"]
    handling: melioration

# Курируемая таблица подтверждённых режимов (человек подтверждает запись,
# методика 6.2, вариант б). Автоматический разбор свободного текста режима
# в E не выполняется.
regime_effects:
  # Зона регулирования застройки Р-1 (3) ОКН «Усадьба Татищева» (50-09).
  # Подтверждено прототипом 2026-10-14: акт 1182-ПП от 15.09.2025 (geodocs
  # документ 46); стр. 28 — высота ≤ 9 м до конька; стр. 8 — запрет
  # промышленных/коммунально-складских зданий, требования к облику
  # и нейтральным материалам. Применимо к ИЖД: дом ≤ 9 м — совместимый
  # вариант первично установлен. E2 = 15.
  - registry_number: "50:09-6.1690"
    effect: E2
    evidence: "1182-ПП от 15.09.2025, стр. 28: Р-1 — высота ≤ 9 м до верхней отметки кровли; стр. 8: запрет пром./коммунально-складских зданий, требования к облику и нейтральным материалам; совместимый вариант (дом ≤ 9 м) установлен"
