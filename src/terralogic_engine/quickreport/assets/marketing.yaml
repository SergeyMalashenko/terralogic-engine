# Коммерческий блок QuickReport (§37–39 ТЗ): цены, CTA, next-step.
# Статическая конфигурация продукта; НЕ входит в methodology_sha256
# (маркетинг — не часть методики оценки). LLM не генерирует и не меняет
# эти значения. Присоединяется к отчёту на presentation layer,
# в ReportContext не попадает.

report_title: "Подробное заключение по участку"

services:
  - key: detailed_report
    name: "Подробное заключение по участку"
    price_rub: 30000
    credit_rub: 3000  # зачёт стоимости экспресс-отчёта
    description: >
      Проверка по первичным документам: границы зон, требования регламентов,
      условия подключения коммуникаций, варианты размещения дома.
  - key: parcel_selection
    name: "Подбор участка под вашу задачу"
    price_from_rub: 45000
    description: >
      Сравнение нескольких участков по методике TerraLogicX до сделки.

cta: >
  Чтобы перейти от экспресс-оценки к подробному заключению или обсудить
  подбор участка, оставьте заявку — менеджер свяжется с вами.
