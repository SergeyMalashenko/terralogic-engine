# Методика скоринга участка «TerraLogicX Express» — версия 6.3 (2026-10-29).
# Верифицирована владельцем 2026-10-29: тесты §14 (tests/test_melioration_63.py)
# и пересчёт 7 мелиорационных кейсов выборки.
# Цель: индивидуальный жилой дом. Оценка = max(0; 100 − Σ B_group (потолок
# 40 на группу, компоненты d и q) − U (коммуникации) − G (площадь/
# конфигурация, G = max(A; C)). Классификация зон — по каталогу
# zouit_catalog_62.yaml (ст. 105 ЗК РФ); зоны без спецправила получают
# универсальную шкалу E0–E4 при подтверждённом режиме, иначе Q30.
# zso1980 и прочие нерасшифрованные признаки источников из рассмотрения
# исключены (решение владельца 2026-10-08).
methodology_version: "6.3"
target: "индивидуальный жилой дом"

base_score: 100
score_min: 0
score_max: 100
group_cap: 40

# Статусы первичного отбора — по приоритету, первое выполненное условие.
statuses:
  - key: stop
    title: "Не соответствует заявленной цели"
    summary: "Выявлен подтверждённый стоп-фактор: целевое использование несовместимо с режимом участка. Числовая оценка не выдаётся."
  - key: insufficient
    title: "Недостаточно данных для отбора"
    summary: "Ключевые сведения не получены либо выявлен фактор, требующий ручной проверки. Числовая оценка приостановлена до уточнения."
  - key: attention
    title: "Требует повышенного внимания"
    summary: "Участок имеет ограничения, которые могут повлиять на проект дома и расходы. Возможность реализовать ваш замысел требует подробного анализа."
  - key: ok
    title: "Можно продолжить рассмотрение"
    summary: "Выявленные особенности вряд ли повлияют на проект дома. Рекомендуется стандартная проверка перед покупкой."

thresholds:
  attention_score_below: 85      # оценка ниже 85 → повышенное внимание
  attention_group_deduction: 15  # вычет любой группы ≥ 15 → повышенное внимание

# Универсальная шкала подтверждённого влияния (6.2 §4) и вычет
# неопределённости режима (§12). Применяется к зонам каталога
# zouit_catalog_62.yaml без спецправила. Универсальный вычет НЕ
# умножается на охват; по одному фактору — наивысший применимый уровень.
universal_scale:
  E0: 0    # пересечение не выявлено / режим не создаёт требований к цели
  E1: 5    # дополнительная документированная процедура/согласование
  E2: 15   # требования к высоте, облику, материалам, использованию
  E3: 25   # исключение части территории / спец. инженерные мероприятия
  E4: 35   # E3 + отдельные обязательные инженерные мероприятия
q_regime_unknown: 30  # пересечение подтверждено, существенный режим неизвестен

coverage_words:
  - min_pct: 80
    word: "практически весь участок"
  - min_pct: 20
    word: "часть участка"
  - min_pct: 0
    word: "край участка"

# U — неопределённость коммуникаций (состояния вопросов пока только
# «неизвестно»: источников подключения в контуре нет).
communications:
  electricity: 4
  water: 3
  sewage: 3
  max: 10

# A — площадь на минимальной границе по регламенту ПЗЗ (S == Smin).
area:
  equal_deduction: 5

# C — размещение тестового контура после применимых отступов.
configuration:
  test_square_m: 10      # тестовое пятно дома
  control_square_m: 12   # контрольный контур с резервом 1 м
  tight_deduction: 5     # 10×10 входит, 12×12 нет
  no_fit_deduction: 10   # 10×10 не входит
  grid_step_m: 1.0       # базовая сетка поиска
  fine_grid_step_m: 0.5  # подтверждающий поиск при отрицательном результате

# Шесть групп ограничений; match — любая подстрока (casefold) в типе или
# названии зоны, match_all — все подстроки; bands — по охвату участка в %,
# иначе фиксированный deduction. Порядок факторов внутри группы важен:
# первое совпадение выигрывает.
groups:
  - key: water
    title: "Водные ограничения водного объекта"
    factors:
      - id: water_protection_zone
        title: "Водоохранная зона"
        match: ["водоохранн"]
        bands:
          - { above: 75, deduction: 25 }
          - { at_least: 25, deduction: 15 }
          - { above: 0, deduction: 5 }
      - id: coastal_strip
        title: "Прибрежная защитная полоса"
        match: ["прибрежн"]
        deduction: 10
  - key: airport
    title: "Приаэродромная территория"
    factors:
      - id: airport_subzone_no_height
        title: "Подзона без высотных ограничений"
        match_all: ["приаэродромн", "шестая подзона"]
        bands:
          - { above: 75, deduction: 5 }
          - { at_least: 25, deduction: 3 }
          - { above: 0, deduction: 1 }
      - id: airport_subzone_height
        title: "Подзона с высотными ограничениями"
        match: ["приаэродромн"]
        deduction: 15
  - key: power_line
    title: "Охранные зоны инфраструктуры"
    factors:
      - id: lep_zone
        title: "Охранная зона ЛЭП"
        match: ["лэп", "электропередач", "электросетев"]
        deduction: 20
  - key: sanitary
    title: "Санитарные зоны"
    factors:
      - id: sanitary_protection
        title: "Зона санитарной охраны"
        match: ["санитарной охраны"]
        deduction: 30
      - id: sanitary_guard
        title: "Санитарно-защитная зона"
        match: ["санитарно-защитн"]
        deduction: 15
  - key: forest
    title: "Лесные ограничения"
    factors:
      - id: forest_protection
        title: "Особо защитные участки лесов / защитные леса"
        match: ["особо защитн", "защитные леса", "защитный лес"]
        deduction: 30

# Клиентские формулировки методики 6.1 (разделы 4.2–4.4 и 7).
texts:
  score_explanation: "Чем выше балл, тем меньше выявленных ограничений и факторов, требующих уточнения. Оценка учитывает площадь, конфигурацию и неизвестность коммуникаций, но не подтверждает возможность строительства."
  preliminary_mark: "предварительная"
  communications_unknown: "Сведения об электроснабжении, водоснабжении и отведении бытовых стоков не установлены. Условия и возможные затраты требуют уточнения."
  area_at_minimum: "Площадь на минимальной границе по ПЗЗ — проверьте размещение дома с необходимыми отступами."
  area_below_minimum: "Площадь участка ниже минимальной по применимому регламенту — требуется ручная проверка правового режима."
  geometry_ok: "Например в первичной геометрической проверке тестовое пятно дома размещается с резервом."
  geometry_tight: "Тестовое пятно дома размещается, но запас для изменения его расположения ограничен."
  geometry_no_fit: "Форма и размеры участка ограничивают размещение тестового пятна дома 10 × 10 м. Нужен разбор вариантов под ваши параметры."
  geometry_unknown: "конфигурация участка не проверена"
  stop_no_target_use: "Целевое использование (индивидуальный жилой дом) отсутствует в регламенте территориальной зоны."
  no_land_category: "нет категории земель"
  no_permitted_use: "нет вида разрешённого использования"
  no_zoning: "нет сведений о территориальном зонировании"
  no_zone_checks: "обязательные проверки зон не выполнены (сбой источников)"
  unruled_zone: "зона без надёжной классификации по каталогу ст. 105 ЗК РФ — ручная проверка"
  okn_unknown_regime: "Выявлена зона регулирования застройки объекта культурного наследия. Её требования к строительству пока не установлены. Оценка снижена за неопределённость: необходима подробная проверка условий для вашего дома. Это не означает, что строительство запрещено."
  okn_known_regime: "На участке действуют требования к параметрам и облику застройки. В дальнейшем нужно сопоставить их с вашим домом."
  q30_reason: "Оценка предварительная. Главная причина снижения — неизвестные условия строительства в выявленной зоне. Их нужно проверить по документу, который устанавливает её режим."
  q30_factor_guidance: "Пересечение с этой зоной подтверждено, но её требования к строительству в имеющихся материалах не раскрыты. Оценка снижена за неопределённость; это не означает, что строительство запрещено."
  q30_factor_action: "Получить и разобрать акт, устанавливающий зону, и её режимные требования."
  pzz_missing: "регламент ПЗЗ не получен"
  # Мелиорация — методика 6.3 §6.1.7 (клиентская формулировка дословно).
  info_melioration: "По данным источника участок пересекается с территорией, обозначенной как мелиорируемые земли. Конкретное ограничение строительства по рассмотренным материалам не установлено. Само обозначение не означает запрета или обязательного отдельного согласования. Наличие и расположение мелиоративных сооружений не подтверждены; вычет по одному обозначению слоя не назначен. До земляных работ рекомендуется уточнить расположение дренажных сооружений в зоне работ."
  area_min_not_set: "минимальная площадь регламентом не установлена"
